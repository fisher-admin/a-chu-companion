<!doctype html><meta charset="utf-8"><title>Claude local fixture</title>
<style>body{font:16px -apple-system;margin:28px;background:#faf9f6;color:#242424}h1{font-size:21px}#messages{height:290px;overflow:auto;border:1px solid #ddd;padding:12px;border-radius:10px;background:white}h2{font-size:12px;color:#777}p{margin:8px 0}textarea{width:100%;box-sizing:border-box;height:105px;padding:12px;font:16px -apple-system;margin-top:16px}aside{font-size:11px;color:#888}button{padding:5px 10px}</style>
<h1>A畜伴侣测试对话</h1><p>仅在本机模拟 Claude 回复，不会发送到任何人。</p>
<aside role="group" aria-label="Sidebar">此处变化不能触发翻译：<span id="noise">0</span></aside>
<p role="status" id="stage">Claude finished the response</p><button id="stop-response" hidden>Stop response</button>
<div id="messages" role="group" aria-label="Chat messages"></div>
<textarea id="input" aria-label="Write your prompt to Claude" placeholder="点击这里，再按 Control + Option + E"></textarea>
<p><button id="desktop-history">历史附件与桌面代码测试</button> <button id="long-reply">生成长回复（49k）</button> <button id="new-chat">切换测试会话</button> <label><input id="slow-reply" type="checkbox">慢回复：先思考 12 秒</label> <button id="send">发送（回车）</button> <span id="count">已发送 0 条</span></p>
<script>
const input=document.getElementById('input'), messages=document.getElementById('messages');let sent=[], commandKeys=[], count=0, desktopShape=false;
function record(){window.webkit.messageHandlers.fixture.postMessage({input:input.value,messages:sent,commandKeys,assistantCount:count})}
function generation(running){document.getElementById('stage').textContent=running?'Claude is responding':'Claude finished the response';document.getElementById('stop-response').hidden=!running}
function bubble(author,text){const outer=document.createElement('div');outer.setAttribute('role','group');outer.setAttribute('aria-label',`Message ${messages.children.length+1} of ${messages.children.length+1}`);const inner=document.createElement('div');inner.setAttribute('role','group');const heading=document.createElement('h2');heading.textContent=author+': '+text.slice(0,70);inner.appendChild(heading);const body=document.createElement('div');body.setAttribute('role','group');const p=document.createElement('p');p.textContent=text;body.appendChild(p);inner.appendChild(body);outer.appendChild(inner);messages.appendChild(outer);Array.from(messages.children).forEach((el,i)=>el.setAttribute('aria-label',`Message ${i+1} of ${messages.children.length}`));return p}
function desktopReply(){const p=bubble('Claude responded','Please'), body=p.parentElement, inner=body.parentElement;body.remove();const status=document.createElement('p');status.textContent='Listed files on your computer';inner.appendChild(status);const activity=document.createElement('button');activity.textContent=status.textContent;inner.appendChild(activity);inner.appendChild(p);const code=document.createElement('div');code.setAttribute('role','group');code.setAttribute('aria-label','Code');for(const label of ['Open in Claude Code','Copy to clipboard']){const button=document.createElement('button');button.textContent=label;code.appendChild(button)}const pre=document.createElement('pre');pre.textContent="printf 'KEEP_SETTINGS'\n";code.appendChild(pre);inner.appendChild(code);const ending=document.createElement('p');ending.textContent='Code is preserved. No external messages were sent.';inner.appendChild(ending);return p}
function send(command=false){if(!input.value.trim())return;sent.push(input.value);commandKeys.push(command);bubble('You said',input.value);input.value='';document.getElementById('count').textContent=`已发送 ${sent.length} 条`;generation(true);record();const slow=document.getElementById('slow-reply').checked;const reply=slow?bubble('Claude responded',''):(desktopShape?desktopReply():bubble('Claude responded','Please'));const parts=['Please keep','Please keep the existing settings.','Please keep the existing settings. Restart the application',`Please keep the existing settings. Restart the application after saving your work. Reply number: ${sent.length}.`];setTimeout(()=>{let i=0;const timer=setInterval(()=>{reply.textContent=(!slow&&desktopShape?'Listed files on your computer ':'')+parts[i++];if(i===parts.length){clearInterval(timer);count++;generation(false);record()}},400)},slow?12000:0);input.focus()}
document.getElementById('desktop-history').onclick=()=>{messages.replaceChildren();sent=[];commandKeys=[];count=0;desktopShape=true;bubble('You said','Old prompt');bubble('Claude responded','Old answer');const attachment=document.createElement('div');attachment.setAttribute('role','group');const file=document.createElement('button');file.textContent='Pasted text.txt';attachment.appendChild(file);const label=document.createElement('p');label.textContent='TXT';attachment.appendChild(label);messages.appendChild(attachment);bubble('Claude responded','Historical attachment answer.');document.getElementById('count').textContent='已发送 0 条';record();input.focus()};
input.addEventListener('input',record);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send(e.metaKey)}});document.getElementById('send').onclick=()=>send();document.getElementById('new-chat').onclick=()=>window.webkit.messageHandlers.fixture.postMessage({command:'switchConversation'});document.getElementById('long-reply').onclick=()=>{bubble('You said','Local long reply verification');bubble('Claude responded','Beginning of the complete long reply.\n'+'Please keep the existing settings.\n'.repeat(1400)+'Final marker: COMPLETE-49K-END.');generation(false);count++;record()};let ticks=0;setInterval(()=>document.getElementById('noise').textContent=++ticks,1200);record();input.focus();
</script>
